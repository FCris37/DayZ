// Configuracion del servidor DayZ - Deer Isle PvE con zonas PvP
// Los scripts copian este archivo a la carpeta del servidor y rellenan la password de admin.

hostname = "Deer Isle PvE | Traders | Zonas PvP";
password = "";                      // Sin password para entrar
passwordAdmin = "__PASSWORD_ADMIN__"; // La pone el script automaticamente (ver password_admin.txt en la carpeta del servidor)
maxPlayers = 10;

enableWhitelist = 0;
verifySignatures = 2;               // Solo mods firmados (las .bikey de keys\)
forceSameBuild = 1;

disableVoN = 0;
vonCodecQuality = 20;
disable3rdPerson = 0;
disableCrosshair = 0;
disablePersonalLight = 1;
lightingConfig = 0;

serverTime = "SystemTime";
serverTimeAcceleration = 6;         // 1 hora real = 6 horas de juego
serverNightTimeAcceleration = 4;    // Noches mas cortas
serverTimePersistent = 0;

guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;
steamQueryPort = 27016;
enableCfgGameplayFile = 1;          // Usa cfggameplay.json de la mision de Deer Isle

class Missions
{
    class DayZ
    {
        template = "empty.deerisle";
    };
};
